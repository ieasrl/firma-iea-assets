<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>IEA — Recursos de firma corporativa</title>
</head>
<body style="margin:0;padding:40px;background:#070d13;color:#fff;font-family:Arial,Helvetica,sans-serif;">
  <div style="max-width:760px;margin:0 auto;">
    <h1 style="margin:0 0 8px;color:#29a3dc;">Recursos de firma corporativa IEA</h1>
    <p style="margin:0 0 30px;color:#bfc9d0;">Si todos los elementos siguientes aparecen correctamente, los assets están disponibles públicamente.</p>
    <div style="padding:25px;border:1px solid #34404a;border-radius:12px;">
      <img src="iea-logo-stacked-dark.png" width="300" alt="Logo IEA" style="display:block;max-width:100%;height:auto;margin-bottom:30px;">
      <h2 style="font-size:16px;color:#bfc9d0;">Datos de contacto</h2>
      <p>
        <img src="icon-location.png" width="30" alt="Ubicación" style="vertical-align:middle;margin-right:12px;">
        <img src="icon-phone.png" width="30" alt="Teléfono" style="vertical-align:middle;margin-right:12px;">
        <img src="icon-web.png" width="30" alt="Web" style="vertical-align:middle;margin-right:12px;">
        <img src="icon-shield.png" width="30" alt="Garantía" style="vertical-align:middle;">
      </p>
      <h2 style="margin-top:28px;font-size:16px;color:#bfc9d0;">Redes sociales</h2>
      <p>
        <img src="social-facebook.png" width="40" alt="Facebook" style="margin-right:9px;">
        <img src="social-linkedin.png" width="40" alt="LinkedIn" style="margin-right:9px;">
        <img src="social-instagram.png" width="40" alt="Instagram" style="margin-right:9px;">
        <img src="social-youtube.png" width="40" alt="YouTube">
      </p>
      <h2 style="margin-top:28px;font-size:16px;color:#bfc9d0;">Medio ambiente</h2>
      <p>
        <img src="icon-leaf.png" width="65" alt="Hoja" style="margin-right:30px;">
        <img src="icon-planet.png" width="65" alt="Planeta">
      </p>
    </div>
  </div>
</body>
</html>
